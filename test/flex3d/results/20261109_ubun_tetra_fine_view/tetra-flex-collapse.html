<script>
(()=>{
const root=document.getElementById('tetra-flex-playback');
const data=JSON.parse(root.querySelector('[data-mesh]').textContent);
const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
const time=root.querySelector('[data-frame]'),cut=root.querySelector('[data-cut]'),play=root.querySelector('[data-play]');
time.max=data.frames.length-1;root.querySelector('[data-note]').textContent=data.note;
let state={frame:0,cut:35,az:-.65,el:.45,zoom:1,selected:809,surface:false,reference:true};
let playing=false,drag=null,last=0,projectedCenters=[];
const initialCenter=data.rest.reduce((a,p)=>a.map((x,j)=>x+p[j]/data.rest.length),[0,0,0]);
const localRest=data.rest.map(p=>p.map((x,j)=>x-initialCenter[j]));
const pairs=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
const boxPairs=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
const phaseNames={settle:'静置',approach:'下压',close:'合拢',lift:'提起',lift_hold:'悬挂',carry:'搬运',carry_hold:'搬运保持',lower:'放下',open:'松开'};
function determinant(p){const a=p[1].map((v,i)=>v-p[0][i]),b=p[2].map((v,i)=>v-p[0][i]),c=p[3].map((v,i)=>v-p[0][i]);return a[0]*(b[1]*c[2]-b[2]*c[1])-a[1]*(b[0]*c[2]-b[2]*c[0])+a[2]*(b[0]*c[1]-b[1]*c[0]);}
const volumes=data.tets.map(t=>determinant(t.map(i=>data.rest[i])));
function color(name){return getComputedStyle(root).getPropertyValue(name).trim();}
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{trial:data.source,frame:state.frame,time:data.frames[state.frame].t,selected_tetrahedron:state.selected},privateContent:state}).catch(()=>{});}
function restore(saved){if(saved?.privateContent){for(const k of Object.keys(state)){if(typeof saved.privateContent[k]===typeof state[k])state[k]=saved.privateContent[k];}state.frame=Math.max(0,Math.min(data.frames.length-1,state.frame));}}
restore(window.openai?.widgetState);
function draw(){
const width=canvas.clientWidth,height=canvas.clientHeight,dpr=window.devicePixelRatio||1;
if(canvas.width!==width*dpr||canvas.height!==height*dpr){canvas.width=width*dpr;canvas.height=height*dpr;}
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
const f=data.frames[state.frame],center=f.v.reduce((a,p)=>a.map((x,j)=>x+p[j]/f.v.length),[0,0,0]);
const scale=Math.min(width/.36,height/.25)*state.zoom;
function project(p){const x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2];const a=x*Math.cos(state.az)-y*Math.sin(state.az),b=x*Math.sin(state.az)+y*Math.cos(state.az);return[width/2+scale*a,height*.55-scale*(z*Math.cos(state.el)-b*Math.sin(state.el)),b*Math.cos(state.el)+z*Math.sin(state.el)];}
const projected=f.v.map(project),structural=color('--foreground'),selected=color('--viz-series-1'),jaw=color('--viz-series-2');
const yMin=Math.min(...localRest.map(p=>p[1])),yMax=Math.max(...localRest.map(p=>p[1]));
const visible=data.tets.map((t,i)=>({t,i,y:t.reduce((a,n)=>a+localRest[n][1]/4,0)})).filter(x=>x.y>=yMin+(yMax-yMin)*state.cut/100);
projectedCenters=visible.map(({t,i})=>({i,p:t.reduce((a,n)=>a.map((x,j)=>x+projected[n][j]/4),[0,0,0])}));
if(state.surface){const faces=[];for(const {t}of visible)for(const ids of [[0,1,2],[0,1,3],[0,2,3],[1,2,3]]){const pts=ids.map(i=>projected[t[i]]);faces.push({pts,z:pts.reduce((a,p)=>a+p[2]/3,0)});}faces.sort((a,b)=>a.z-b.z);ctx.fillStyle=selected;ctx.globalAlpha=.035;for(const {pts}of faces){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();}}
ctx.globalAlpha=.23;ctx.strokeStyle=structural;ctx.lineWidth=1;const edges=new Set();ctx.beginPath();for(const {t}of visible)for(const[a,b]of pairs){const v=t[a],w=t[b],key=v<w?v+','+w:w+','+v;if(edges.has(key))continue;edges.add(key);ctx.moveTo(projected[v][0],projected[v][1]);ctx.lineTo(projected[w][0],projected[w][1]);}ctx.stroke();
if(state.reference){const lo=[0,1,2].map(j=>Math.min(...localRest.map(p=>p[j]))),hi=[0,1,2].map(j=>Math.max(...localRest.map(p=>p[j])));const box=[];for(const x of[lo[0],hi[0]])for(const y of[lo[1],hi[1]])for(const z of[lo[2],hi[2]])box.push(project([x+center[0],y+center[1],z+center[2]]));ctx.globalAlpha=.3;ctx.setLineDash([4,4]);ctx.beginPath();for(const[a,b]of boxPairs){ctx.moveTo(...box[a].slice(0,2));ctx.lineTo(...box[b].slice(0,2));}ctx.stroke();ctx.setLineDash([]);}
ctx.globalAlpha=.8;ctx.strokeStyle=jaw;ctx.lineWidth=1.5;for(const points of f.jaws){const q=points.map(project);ctx.beginPath();for(const[a,b]of boxPairs){ctx.moveTo(q[a][0],q[a][1]);ctx.lineTo(q[b][0],q[b][1]);}ctx.stroke();}
if(state.selected>=0){const t=data.tets[state.selected];const signed=determinant(t.map(i=>f.v[i]))/volumes[state.selected];ctx.strokeStyle=signed<=0?color('--destructive'):selected;ctx.globalAlpha=1;ctx.lineWidth=2;ctx.beginPath();for(const[a,b]of pairs){ctx.moveTo(projected[t[a]][0],projected[t[a]][1]);ctx.lineTo(projected[t[b]][0],projected[t[b]][1]);}ctx.stroke();const J=determinant(t.map(i=>f.v[i]))/volumes[state.selected];root.querySelector('[data-detail]').textContent=`单元 #${state.selected} · 体积比 J = ${J.toFixed(3)} · ${phaseNames[f.phase]||f.phase}`;}
ctx.globalAlpha=1;root.querySelector('[data-time]').textContent=f.t.toFixed(2)+' s';root.querySelector('[data-cut-value]').textContent=state.cut+'%';time.value=state.frame;cut.value=state.cut;root.querySelector('[data-surface]').checked=state.surface;root.querySelector('[data-reference]').checked=state.reference;
}
time.addEventListener('input',()=>{state.frame=Number(time.value);draw();});time.addEventListener('change',persist);
cut.addEventListener('input',()=>{state.cut=Number(cut.value);draw();});cut.addEventListener('change',persist);
for(const name of ['surface','reference'])root.querySelector('[data-'+name+']').addEventListener('change',e=>{state[name]=e.target.checked;draw();persist();});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;state.az+=dx*.008;state.el=Math.max(-1.4,Math.min(1.4,state.el+dy*.008));if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;drag.x=e.clientX;drag.y=e.clientY;draw();});
canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null;for(const c of projectedCenters){const distance=(c.p[0]-x)**2+(c.p[1]-y)**2;if(!best||distance<best.distance)best={i:c.i,distance};}if(best)state.selected=best.i;}drag=null;draw();persist();});
canvas.addEventListener('wheel',e=>{e.preventDefault();state.zoom=Math.max(.5,Math.min(3,state.zoom*Math.exp(-e.deltaY*.001)));draw();},{passive:false});
function tick(now){if(!playing)return;if(now-last>=200){last=now;state.frame++;if(state.frame>=data.frames.length){state.frame=data.frames.length-1;playing=false;play.textContent='播放';persist();}draw();}if(playing)requestAnimationFrame(tick);}
play.addEventListener('click',()=>{playing=!playing;play.textContent=playing?'暂停':'播放';if(playing){if(state.frame===data.frames.length-1)state.frame=0;last=0;requestAnimationFrame(tick);}else persist();});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);draw();}});
new ResizeObserver(draw).observe(canvas);new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});draw();
})();
</script>
